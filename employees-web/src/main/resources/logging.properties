# Optional logging configuration. Use it with:
#   -Djava.util.logging.config.file=src/main/resources/logging.properties
# Without it the application installs the same one-line format programmatically (WebApp.configureLogging).
handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = com.ivory.employees.util.LogFormatter

# FINE also logs the generated SQL and every answer body.
com.ivory.employees.level = INFO

# Embedded Tomcat is chatty at INFO during startup only.
org.apache.catalina.level = INFO
org.apache.coyote.level = INFO
